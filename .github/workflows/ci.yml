name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RYSEN-MONITOR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run pytest
        run: python -m pytest -q

  dashboard-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RYSEN-MONITOR
        uses: actions/checkout@v4
        with:
          path: RYSEN-MONITOR

      - name: Checkout System-X-Installer
        uses: actions/checkout@v4
        with:
          repository: ShaYmez/System-X-Installer
          path: System-X-Installer

      - name: Verify installer bundle is in sync
        run: |
          cd System-X-Installer
          bash scripts/sync-rysen-monitor-html.sh --check --check-templates ../RYSEN-MONITOR/html
