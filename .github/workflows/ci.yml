name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RYSEN-MONITOR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev pkg-config gcc

      - name: Install Python dependencies
        run: pip install pytest -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  dashboard-sync:
    runs-on: ubuntu-latest
    if: >-
      secrets.INSTALLER_REPO_TOKEN != '' &&
      github.repository == 'ShaYmez/RYSEN-MONITOR' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout RYSEN-MONITOR
        uses: actions/checkout@v4
        with:
          path: RYSEN-MONITOR

      - name: Checkout System-X-Installer
        uses: actions/checkout@v4
        with:
          repository: ShaYmez/System-X-Installer
          path: System-X-Installer
          token: ${{ secrets.INSTALLER_REPO_TOKEN }}

      - name: Verify installer bundle is in sync
        run: |
          cd System-X-Installer
          bash scripts/sync-rysen-monitor-html.sh --check --check-templates ../RYSEN-MONITOR/html
